name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      # Includes the integration tests that start the simulated plant and read
      # it over real OPC UA and Modbus TCP.
      - run: python -m pytest -q
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: web

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema
      - name: Fixtures satisfy the contracts
        run: |
          python - <<'PY'
          import glob, json, jsonschema
          ctx = jsonschema.Draft7Validator(json.load(open("contracts/machine-context.schema.json")))
          spec = jsonschema.Draft7Validator(json.load(open("contracts/screen-spec.schema.json")))
          for f in glob.glob("contracts/fixtures/context.*.json"):
              ctx.validate(json.load(open(f)))
          for f in glob.glob("contracts/fixtures/spec.*.json"):
              spec.validate(json.load(open(f)))
          print("contracts ok")
          PY
